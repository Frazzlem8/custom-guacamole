events {
    worker_connections 1024;
}

http {
    # Upstream for gateway WebSocket connections
    upstream gateways {
        # ip_hash provides sticky sessions (like ALB cookie-based stickiness)
        ip_hash;
        
        server gateway-1:8080;
        # server gateway-2:8080;
        # server gateway-3:8080;
    }

    # Upstream for gateway health checks
    upstream gateway_health {
        server gateway-1:3001;
        # server gateway-2:3001;
        # server gateway-3:3001;
    }

    # WebSocket map for upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Main server - WebSocket proxy
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://gateways;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Forward headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings (important for long RDP sessions!)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 60s;
        }
    }

    # Health dashboard server
    server {
        listen 8080;
        server_name _;

        # Serve static health dashboard
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Proxy to gateway health endpoints
        location /api/gateway-1 {
            proxy_pass http://gateway-1:3001/;
        }

        # location /api/gateway-2 {
        #     proxy_pass http://gateway-2:3001/;
        # }

        # location /api/gateway-3 {
        #     proxy_pass http://gateway-3:3001/;
        # }
    }
}
